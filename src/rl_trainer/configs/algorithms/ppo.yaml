cls: rl_trainer.algorithms.ppo.model:PPOBaselineModel

$name: PPOBaseline

inputs:
  policy: MlpPolicy
  seed: 0
  learning_rate: 0.0003
  gamma:         0.99
  gae_lambda:    0.95
  clip_range:    0.2
  n_steps:       1024
  batch_size:    32
  n_epochs:      1
  ent_coef:      0.0
  vf_coef:       0.5
  max_grad_norm: 0.5
  progress_bar: True

logger:
  - stable_baselines3.common.logger:Logger:
      folder: null
      output_formats:
        - rl_trainer.reporters.mlflow_reporters:MLflowOutputFormat

callbacks:
  - rl_trainer.callbacks.mlflow:MLflowCallback:
      save_freq: 5000
